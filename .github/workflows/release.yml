name: Release

# Publishes the Cloud Codex container image when a version tag is pushed.
#
# The image is named for the product, not the repository: `c2` is a legacy
# codename and an image an evaluator types into `docker pull` is a user-facing
# string. ghcr.io also requires a lowercase path, which `Cloud-City-Computing`
# is not, so the owner is spelled out rather than taken from the context.

on:
  push:
    tags: ['v*']

env:
  IMAGE: ghcr.io/cloud-city-computing/cloud-codex

jobs:
  # The tag is not a promise that the tagged commit is green: tags can be
  # pushed to any commit, and CI only runs on main. Re-prove it here before
  # publishing something the world can pull.
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloudcodex

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloudcodex/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Strip the leading v so the image tag reads 0.9.0, matching the version
      # in package.json rather than the git tag spelling.
      - name: Derive version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Fail if the tag disagrees with package.json
        run: |
          manifest=$(node -p "require('./cloudcodex/package.json').version")
          if [ "$manifest" != "${{ steps.version.outputs.value }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json ${manifest}." >&2
            echo "A published image whose reported version is a lie is worse than no image." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only. arm64 would need cross-building sharp and bcrypt under
      # QEMU emulation, which is slow and fails in ways that only show up at
      # runtime; Apple Silicon users run this under Docker Desktop's emulation
      # instead. Tracked as a known gap in docs/maps/build-test-and-ops.md.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cloudcodex
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
