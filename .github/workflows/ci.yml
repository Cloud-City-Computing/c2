name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. A stacked PR (one whose
  # base is another feature branch) reported no checks at all under a
  # `branches: [main]` filter, and a required status check that never reports
  # blocks the merge permanently rather than failing it. That combination would
  # have deadlocked this repo the moment required checks were switched on.
  pull_request:

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest

    # A throwaway MySQL for the live-MySQL integration project. It lives
    # inside this job, the check main already requires, so no
    # branch-protection change is needed to gate on it. The root password is
    # not a secret: it guards an ephemeral service container that exists only
    # for the length of this job.
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval 5s --health-timeout 5s --health-retries 30

    defaults:
      run:
        working-directory: cloudcodex

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloudcodex/package-lock.json

      - run: npm ci

      # The dependency gate, first after install so a new advisory fails in
      # seconds under its own name rather than after the suite. Before it,
      # npm audit ran nowhere, and 19 production findings piled up unseen.
      # Blocking and production-only: moderate is the floor GitHub's own
      # advisory severity uses, and a dev-tool advisory must not turn every
      # PR red. Cloud Command runs the same command. Clear it by upgrading
      # the package the step names (npm audit fix, or a major with its
      # changelog read), never by lowering the level.
      - name: Dependency audit (production, blocking)
        run: npm audit --omit=dev --audit-level=moderate

      # The whole tree, dev tools included, for visibility only:
      # continue-on-error keeps a red result on the step without failing
      # the job.
      - name: Dependency audit (all, advisory only)
        run: npm audit
        continue-on-error: true

      - run: npm run lint

      - run: npm test

      # mysql_connect.js reads no DB_PORT, so the service must answer on 3306.
      - name: Integration tests (live MySQL)
        env:
          IT_DB_HOST: 127.0.0.1
          IT_DB_ROOT_PASSWORD: ci-root-password
        run: npm run test:integration

      - name: Run coverage
        run: npm run test:coverage

      # The production Vite build is not exercised by lint or the suite. Without
      # this step a bad import, or a dependency missing from vite.config.js's
      # manualChunks, passes CI and reaches main.
      - name: Build production frontend
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cloudcodex/coverage/
          retention-days: 14
