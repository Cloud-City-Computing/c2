name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloudcodex

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloudcodex/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Run coverage
        run: npm run test:coverage

      # The production Vite build is not exercised by lint or the suite. Without
      # this step a bad import, or a dependency missing from vite.config.js's
      # manualChunks, passes CI and reaches main.
      - name: Build production frontend
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cloudcodex/coverage/
          retention-days: 14
