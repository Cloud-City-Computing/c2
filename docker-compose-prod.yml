services:
  database:
    image: mysql:8
    container_name: cloudcodex-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u${DB_USER}", "-p${DB_PASS}"]
      interval: 7s
      timeout: 8s
      retries: 15

  app:
    build:
      context: ./cloudcodex
      dockerfile: Dockerfile
    container_name: cloudcodex-app
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    # Both sides follow PORT so setting it in .env moves the published mapping
    # too. Without this the app would bind PORT inside the container while
    # Compose still published 3000, and every request to the host would be
    # refused while the logs showed a clean boot. `:-3000` covers the blank
    # PORT= that .env.example ships.
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      DB_HOST: database
    working_dir: /app
    volumes:
      # Same reason as docker-compose-release.yml: uploaded avatars and images
      # extracted out of documents exist only on this disk, because
      # routes/helpers/images.js swaps the base64 data URI in html_content for a
      # /doc-images/ URL. Rebuilding without this volume loses all of them.
      - app_public:/app/public

volumes:
  db_data:
  app_public: